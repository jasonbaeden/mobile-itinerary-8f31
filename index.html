<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>Private itinerary</title>
<style>
:root{color-scheme:light;background:#f1f6ef;color:#203127;font:1rem/1.5 system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;height:100vh;height:100dvh;display:flex;flex-direction:column}
nav{position:relative;z-index:1;display:flex;align-items:flex-start;gap:.5rem;padding:.55rem max(1rem,env(safe-area-inset-right)) .55rem max(1rem,env(safe-area-inset-left));background:#243b30}
.day-tabs{display:flex;flex:1;flex-wrap:wrap;gap:inherit;min-width:0}
button{font:inherit;min-height:44px;padding:.4rem .8rem;border-radius:.4rem;cursor:pointer}
nav button{color:#f5fbf4;background:transparent;border:1px solid #829889}
nav button[aria-current="page"]{background:#f5fbf4;color:#243b30}
nav button:focus-visible{outline:2px solid #9fbea8;outline-offset:2px}
nav .short-day{display:none}
nav .music-toggle{display:grid;place-items:center;flex:0 0 44px;padding:0;color:#6f8978;border-color:transparent}
.music-toggle:is(:hover,:focus-visible,[aria-expanded="true"]){color:#c3dbc9}
.music-toggle svg{width:.8rem;height:.8rem}
.music-panel{position:absolute;inset-block-start:calc(100% + .4rem);inset-inline-end:max(.5rem,env(safe-area-inset-right));width:min(24rem,calc(100vw - 1rem));max-height:calc(100dvh - 5rem);overflow:auto;padding:.6rem;border:1px solid #cddbcf;border-radius:.6rem;background:#fbfdf9;box-shadow:0 .4rem 1.4rem #20312740}
.music-heading{display:flex;justify-content:space-between;align-items:center;gap:.5rem;margin-bottom:.6rem}
.music-heading h2{margin:0;font:normal 1.15rem/1.2 Georgia,serif}
.music-heading p{margin:.12rem 0 0;color:#4c6053;font-size:.85rem}
.music-panel .music-close{flex:0 0 44px;padding:0;background:#e6eee5;color:#243b30;border-color:#cddbcf;font-size:1.25rem}
.music-panel iframe{display:block;width:100%;height:144px;border:0;border-radius:.38rem;background:#e6eee5}
.music-panel a{display:inline-block;margin-top:.45rem;color:#265648;font-size:.83rem}
@media(max-width:600px){
  nav{gap:.25rem;padding-inline:max(.5rem,env(safe-area-inset-left)) max(.5rem,env(safe-area-inset-right))}
  .day-tabs button{flex:1;padding-inline:.25rem;font-size:.9rem}
}
@media(max-width:465px){
  nav .full-day{display:none}
  nav .short-day{display:inline}
}
#page{flex:1;min-height:0;width:100%;border:0}
main{margin:auto;padding:1.25rem;width:min(100%,28rem)}
h1{font:normal 2rem/1.2 Georgia,serif}
form{display:grid;gap:.6rem}
input{font:inherit;width:100%;padding:.6rem;border:1px solid #788b7c;border-radius:.4rem}
form button{background:#243b30;color:#f5fbf4;border:0}
#status{min-height:1.5em}
[hidden]{display:none!important}
</style></head><body>
<main id="gate"><h1>Private itinerary</h1><p>Open the itinerary with our private link or access key.</p>
<form id="unlock"><label for="key">Access key</label><input id="key" type="password" autocomplete="off" autocapitalize="none" spellcheck="false" required><button>Open itinerary</button></form>
<p id="status" role="status"></p></main>
<nav id="days" aria-label="Trip tabs" hidden>
  <div class="day-tabs">
    <button type="button" data-day="friday" aria-label="Friday"><span class="full-day">Friday</span><span class="short-day" aria-hidden="true">Fri</span></button>
    <button type="button" data-day="saturday" aria-label="Saturday"><span class="full-day">Saturday</span><span class="short-day" aria-hidden="true">Sat</span></button>
    <button type="button" data-day="sunday" aria-label="Sunday"><span class="full-day">Sunday</span><span class="short-day" aria-hidden="true">Sun</span></button>
    <button type="button" data-day="monday" aria-label="Monday"><span class="full-day">Monday</span><span class="short-day" aria-hidden="true">Mon</span></button>
    <button type="button" data-day="misc">Misc</button>
    <button type="button" data-day="todo">To-do</button>
  </div>
  <button type="button" id="music-toggle" class="music-toggle" aria-label="Trip music" aria-controls="music-panel" aria-expanded="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M9 18V5l12-2v13M9 8l12-2"/>
      <ellipse cx="6" cy="18" rx="3" ry="2"/>
      <ellipse cx="18" cy="16" rx="3" ry="2"/>
    </svg>
  </button>
  <section id="music-panel" class="music-panel" aria-labelledby="music-title" hidden>
    <div class="music-heading">
      <div><h2 id="music-title">Dancing in the Moonlight</h2><p>Toploader</p></div>
      <button type="button" id="music-close" class="music-close" aria-label="Close music player"><span aria-hidden="true">×</span></button>
    </div>
    <div id="music-audio"></div>
    <a id="music-link" target="_blank" rel="noopener noreferrer">Open in Spotify</a>
  </section>
</nav>
<iframe id="page" title="Itinerary" referrerpolicy="no-referrer" hidden></iframe>

const days = document.getElementById("days");
const dayButtons = days.querySelectorAll("[data-day]");
const frame = document.getElementById("page");
const status = document.getElementById("status");
const musicToggle = document.getElementById("music-toggle");
const musicPanel = document.getElementById("music-panel");
const musicAudio = document.getElementById("music-audio");
const trackId = "118qWAedBHAjTZRFV2xDBw";
document.getElementById("music-link").href = `https://open.spotify.com/track/${trackId}`;
let pages;
let activeDay;

function closeMusic() {
  musicPanel.hidden = true;
  musicAudio.replaceChildren();
  musicToggle.setAttribute("aria-expanded", "false");
  musicToggle.focus();
}

musicToggle.addEventListener("click", () => {
  if (!musicPanel.hidden) {
    closeMusic();
    return;
  }
  musicPanel.hidden = false;
  musicToggle.setAttribute("aria-expanded", "true");
  const player = document.createElement("iframe");
  player.title = "Audio player: Dancing in the Moonlight by Toploader";
  player.allow = "autoplay; encrypted-media";
  player.referrerPolicy = "no-referrer";
  // Spotify uses the audio layout below the video player's minimum height.
  player.src = `https://open.spotify.com/embed/track/${trackId}?theme=0`;
  musicAudio.append(player);
});
document.getElementById("music-close").addEventListener("click", closeMusic);
document.addEventListener("keydown", event => {
  if (event.key === "Escape" && !musicPanel.hidden) closeMusic();
});

function showDay(day) {
  if (day === activeDay) return;
  activeDay = day;
  for (const button of dayButtons) {
    if (button.dataset.day === day) {
      button.setAttribute("aria-current", "page");
      document.title = "Rome · " + (button.getAttribute("aria-label") || button.textContent);
    } else {
      button.removeAttribute("aria-current");
    }
  }
  frame.title = document.title;
  frame.srcdoc = pages[day];
}

frame.addEventListener("load", () => {
  frame.contentDocument.addEventListener("click", event => {
    const anchor = event.target.closest?.("a");
    const href = anchor?.getAttribute("href");
    if (!href) return;
    if (href.startsWith("#")) {
      const destination = frame.contentDocument.getElementById(href.slice(1));
      if (!destination) return;
      event.preventDefault();
      destination.scrollIntoView();
    } else if (pages && Object.hasOwn(pages, href)) {
      event.preventDefault();
      showDay(href);
    }
  });
});
for (const button of dayButtons) {
  button.addEventListener("click", () => showDay(button.dataset.day));
}

function decodeBase64(value) {
  return Uint8Array.from(atob(value), char => char.charCodeAt(0));
}

async function unlock(keyText) {
  status.textContent = "Opening itinerary…";
  try {
    const text = keyText.trim();
    if (!/^[A-Za-z0-9_-]{43}$/.test(text)) throw new Error("Invalid access key");
    const keyBytes = decodeBase64(text.replace(/-/g, "+").replace(/_/g, "/") + "=");
    const key = await crypto.subtle.importKey("raw", keyBytes, "AES-GCM", false, ["decrypt"]);
    const encrypted = decodeBase64(bundle);
    const decoded = await crypto.subtle.decrypt(
      {name:"AES-GCM", iv:encrypted.slice(0, 12)},
      key,
      encrypted.slice(12),
    );
    pages = JSON.parse(new TextDecoder().decode(decoded));
    document.getElementById("gate").hidden = true;
    days.hidden = false;
    frame.hidden = false;
    showDay("friday");
  } catch {
    status.textContent = "Could not open the itinerary. Use the full private link or check the access key.";
  }
}

document.getElementById("unlock").addEventListener("submit", event => {
  event.preventDefault();
  unlock(document.getElementById("key").value);
});
const incomingKey = location.hash.slice(1);
if (incomingKey) unlock(incomingKey);
