<title>Private itinerary</title>
<style>
:root{color-scheme:light;background:#f1f6ef;color:#203127;font:1rem/1.5 system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;height:100vh;height:100dvh;display:flex;flex-direction:column}
nav{display:flex;flex-wrap:wrap;gap:.5rem;padding:.55rem max(1rem,env(safe-area-inset-left));background:#243b30}
button{font:inherit;min-height:44px;padding:.4rem .8rem;border-radius:.4rem;cursor:pointer}
nav button{color:#f5fbf4;background:transparent;border:1px solid #829889}
nav button[aria-current="page"]{background:#f5fbf4;color:#243b30}
nav .short-day{display:none}
@media(max-width:440px){
  nav{gap:.25rem;padding-inline:.5rem}
  nav button{flex:1;padding-inline:.25rem;font-size:.9rem}
}
@media(max-width:400px){
  nav .full-day{display:none}
  nav .short-day{display:inline}
}
iframe{flex:1;min-height:0;width:100%;border:0}
main{margin:auto;padding:1.25rem;width:min(100%,28rem)}
h1{font:normal 2rem/1.2 Georgia,serif}
form{display:grid;gap:.6rem}
input{font:inherit;width:100%;padding:.6rem;border:1px solid #788b7c;border-radius:.4rem}
form button{background:#243b30;color:#f5fbf4;border:0}
#status{min-height:1.5em}
[hidden]{display:none!important}
</style></head><body>

</nav>

const days = document.getElementById("days");
const frame = document.getElementById("page");
const status = document.getElementById("status");
let pages;
let activeDay;

function showDay(day) {
  if (day === activeDay) return;
  activeDay = day;
  for (const button of days.querySelectorAll("button")) {
    if (button.dataset.day === day) {
      button.setAttribute("aria-current", "page");
      document.title = "Rome · " + (button.getAttribute("aria-label") || button.textContent);
    } else {
      button.removeAttribute("aria-current");
    }
  }
  frame.title = document.title;
  frame.srcdoc = pages[day];
}

frame.addEventListener("load", () => {
  frame.contentDocument.addEventListener("click", event => {
    const anchor = event.target.closest?.("a");
    const href = anchor?.getAttribute("href");
    if (!href) return;
    if (href.startsWith("#")) {
      const destination = frame.contentDocument.getElementById(href.slice(1));
      if (!destination) return;
      event.preventDefault();
      destination.scrollIntoView();
    } else if (pages && Object.hasOwn(pages, href)) {
      event.preventDefault();
      showDay(href);
    }
  });
});
for (const button of days.querySelectorAll("button")) {
  button.addEventListener("click", () => showDay(button.dataset.day));
}

function decodeBase64(value) {
  return Uint8Array.from(atob(value), char => char.charCodeAt(0));
}

async function unlock(keyText) {
  status.textContent = "Opening itinerary…";
  try {
    const text = keyText.trim();
    if (!/^[A-Za-z0-9_-]{43}$/.test(text)) throw new Error("Invalid access key");
    const keyBytes = decodeBase64(text.replace(/-/g, "+").replace(/_/g, "/") + "=");
    const key = await crypto.subtle.importKey("raw", keyBytes, "AES-GCM", false, ["decrypt"]);
    const encrypted = decodeBase64(bundle);
    const decoded = await crypto.subtle.decrypt(
      {name:"AES-GCM", iv:encrypted.slice(0, 12)},
      key,
      encrypted.slice(12),
    );
    pages = JSON.parse(new TextDecoder().decode(decoded));
    document.getElementById("gate").hidden = true;
    days.hidden = false;
    frame.hidden = false;
    showDay("friday");
  } catch {
    status.textContent = "Could not open the itinerary. Use the full private link or check the access key.";
  }
}

document.getElementById("unlock").addEventListener("submit", event => {
  event.preventDefault();
  unlock(document.getElementById("key").value);
});
const incomingKey = location.hash.slice(1);
if (incomingKey) unlock(incomingKey);

</script>
